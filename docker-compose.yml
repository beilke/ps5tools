networks:
  vlan20_network:
    external: true
    name: vlan20_network

services:
  ps5jsongenerator:
    image: ps5jsongenerator:latest
    container_name: ps5jsongenerator
    volumes:      
      - /volume1/games/ps4:/volume1/games/ps4
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GAME_DIR=/volume1/games/ps4
      - OUTPUT_DIR=_ps5ContentLoader
      - SERVER_URL=http://192.168.1.190:8084
      - JSON_GAMES=GAMES.json
      - JSON_UPDATES=UPDATES.json
      - JSON_DLC=DLC.json
    restart: unless-stopped    

  ps5contentserver:
    image: ps5contentserver:latest
    container_name: ps5contentserver
    ports:
      - "8084:8080"
    volumes:
      - /volume1/games/ps4:/usr/src/app/data
    restart: unless-stopped    

  ps5contentloader:
    image: ps5contentloader:latest
    container_name: ps5contentloader
    ports:
      - "5000:5000"
    environment:
      - PS5_IP=192.168.20.60
      - DPI_PORT=9090
      - PAYLOAD_PORT=9020
      - GAME_URL=http://192.168.1.190:8084/_ps5ContentLoader/GAMES.json
      - UPDATE_URL=http://192.168.1.190:8084/_ps5ContentLoader/UPDATES.json
      - DLC_URL=http://192.168.1.190:8084/_ps5ContentLoader/DLC.json
    volumes:
      - /volume1/games/ps4/_ps5ContentLoader/payloads:/app/data/payloads
    restart: unless-stopped
    depends_on:
      ps5contentserver:
        condition: service_started    
    
  ps5umtx2:
    image: nginx:alpine
    container_name: ps5umtx2server
    networks:
      vlan20_network:
        ipv4_address: 192.168.20.101  # New static IP
    volumes:    
      -  /volume1/docker/ps5/nginx-umtx2.conf:/etc/nginx/conf.d/default.conf      
    environment:
      - GIT_REPO=https://github.com/idlesauce/umtx2.git
      - UPDATE_INTERVAL=3600 # Update every hour (in seconds)
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
      apk add --no-cache git && 
      rm -rf /usr/share/nginx/html/umtx2 &&
      git clone $$GIT_REPO /usr/share/nginx/html/umtx2 &&
      chown -R nginx:nginx /usr/share/nginx/html &&
      echo 'Health check endpoint' > /usr/share/nginx/html/health &&
      while true; do
        sleep $$UPDATE_INTERVAL
        cd /usr/share/nginx/html/umtx2 && git pull
      done &
      exec nginx -g 'daemon off;'
      "
    restart: unless-stopped
    
  ps5umtx:
    image: nginx:alpine
    container_name: ps5umtxserver
    networks:
      vlan20_network:
        ipv4_address: 192.168.20.102  # New static IP
    volumes:    
      -  /volume1/docker/ps5/nginx-umtx.conf:/etc/nginx/conf.d/default.conf      
    environment:
      - GIT_REPO=https://github.com/idlesauce/PS5-UMTX-Jailbreak.git
      - UPDATE_INTERVAL=3600 # Update every hour (in seconds)
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
      apk add --no-cache git && 
      rm -rf /usr/share/nginx/html/umtx &&
      git clone $$GIT_REPO /usr/share/nginx/html/umtx &&
      chown -R nginx:nginx /usr/share/nginx/html &&
      echo 'Health check endpoint' > /usr/share/nginx/html/health &&
      while true; do
        sleep $$UPDATE_INTERVAL
        cd /usr/share/nginx/html/umtx && git pull
      done &
      exec nginx -g 'daemon off;'
      "
    restart: unless-stopped

  ps5exploit:
    image: nginx:alpine
    container_name: ps5exploitserver
    networks:
      vlan20_network:
        ipv4_address: 192.168.20.103  # New static IP
    volumes:    
      -  /volume1/docker/ps5/nginx-exploit.conf:/etc/nginx/conf.d/default.conf      
    environment:
      - GIT_REPO=https://github.com/idlesauce/PS5-Exploit-Host.git
      - UPDATE_INTERVAL=3600 # Update every hour (in seconds)
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
      apk add --no-cache git && 
      rm -rf /usr/share/nginx/html/exploit &&
      git clone $$GIT_REPO /usr/share/nginx/html/exploit &&
      chown -R nginx:nginx /usr/share/nginx/html &&
      echo 'Health check endpoint' > /usr/share/nginx/html/health &&
      while true; do
        sleep $$UPDATE_INTERVAL
        cd /usr/share/nginx/html/exploit && git pull
      done &
      exec nginx -g 'daemon off;'
      "
    restart: unless-stopped
